name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      BLENDER_VERSION: 4.2.23
      EYEFORGE_FAST: "1"   # masks-only direction test, 8-sample determinism check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Blender 4.2 LTS
        run: |
          sudo apt-get update && sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1
          curl -fsSL https://download.blender.org/release/Blender4.2/blender-$BLENDER_VERSION-linux-x64.tar.xz | tar -xJ -C /opt
          echo "BLENDER_PATH=/opt/blender-$BLENDER_VERSION-linux-x64/blender" >> $GITHUB_ENV
      - run: pip install -r requirements.txt
      - name: Unit, camera, motion, sequence-metadata and direction self-test (headless)
        run: python -m pytest -q tests/test_physiology.py tests/test_camera.py tests/test_motion.py tests/test_sequence.py tests/test_directions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: reports, path: reports/}
